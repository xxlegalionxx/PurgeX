name: purgex
description: "Intelligent multiplatform cleaner application for Android and Windows."
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.2
  material_design_icons_flutter: ^6.0.7096
  
  # State Management
  provider: ^6.0.0
  
  # Storage & File Access
  permission_handler: ^11.4.4
  file_picker: ^6.0.0
  package_info_plus: ^4.1.0
  
  # Database & Local Storage
  sqflite: ^2.2.8+4
  path: ^1.8.3
  path_provider: ^2.1.0
  
  # Utilities
  intl: ^0.19.0
  dio: ^5.3.1
  get_it: ^7.6.0
  
  # Device Info
  device_info_plus: ^9.1.0
  
  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  
flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
    - assets/strings/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
